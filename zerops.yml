zerops:
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles:
        - frontend/dist
    run:
      base: static
      ports:
        - port: 8080
          httpSupport: true